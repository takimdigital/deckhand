<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame — true-width screenshot wrapper</title>
<!--
  qa/frame.html — screenshots at a TRUE width shorter than Chrome's 500px window
  minimum. Serve from the same origin as the page under test, then:

    chrome --headless=new --disable-gpu --hide-scrollbars --virtual-time-budget=8000 \
      --window-size=500,844 --screenshot=C:/out/mobile.png \
      "http://localhost:<port>/qa/frame.html?url=/&w=390&h=844"

  The PNG is 500px wide; the leftmost `w` px ARE the true layout (the pink marker
  line shows where the real viewport ends). Pair with probe.html for the numbers.
-->
<style>
  html,body{margin:0;background:#0b0f12}
  iframe{display:block;border:0;position:absolute;left:0;top:0;background:#fff}
  .mark{position:absolute;top:0;width:2px;height:100%;background:#ff2d95}
  .tag{position:absolute;top:6px;color:#ff2d95;font:700 11px/1.3 monospace}
</style></head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const url = q.get('url') || '/', W = +(q.get('w') || 390), H = +(q.get('h') || 844);
  const fr = document.createElement('iframe');
  fr.src = url; fr.style.width = W + 'px'; fr.style.height = H + 'px';
  const mk = document.createElement('div'); mk.className = 'mark'; mk.style.left = W + 'px';
  const tg = document.createElement('div'); tg.className = 'tag'; tg.style.left = (W + 6) + 'px';
  tg.textContent = 'true ' + W + 'px layout ends here';
  document.body.append(fr, mk, tg);
</script>
</body></html>
